<div class="line {{ 'unmatched' if line is not none and not line.ingredient_id }}" data-row="{{ row }}">
  <input type="hidden" name="row" value="{{ row }}">
  <input type="hidden" name="line_id_{{ row }}" value="{{ line.id if line else '' }}">
  <div class="line-top">
    <div class="raw"><label>Tên trên hoá đơn</label>
      <input name="raw_name_{{ row }}" value="{{ line.raw_name if line else '' }}" required placeholder="Tên mặt hàng"></div>
    {% if line and line.ingredient_id %}
      {% if line.match_score >= 0.999 %}<span class="pill pill-ok" style="margin-top:28px" title="Đã khớp theo lần nhập trước">Đã nhớ</span>
      {% elif line.match_score > 0 %}<span class="pill pill-warn" style="margin-top:28px" title="Gợi ý tự động">? {{ (line.match_score * 100)|round|int }}%</span>{% endif %}
    {% endif %}
    <label class="check" style="margin-top:30px" title="Bỏ dòng này"><input type="checkbox" name="delete_{{ row }}" value="1" class="del-box"> Bỏ</label>
  </div>
  <div class="line-grid">
    <div><label>Nguyên liệu trong kho</label>
      <select name="ingredient_id_{{ row }}" class="ing-select">
        <option value="">— Chưa gắn (bỏ qua khi nhập) —</option>
        <option value="new">＋ Tạo nguyên liệu mới từ tên này</option>
        {% for cat, items in ingredients_by_cat.items() %}
        <optgroup label="{{ cat }}">{% for i in items %}<option value="{{ i.id }}" {{ 'selected' if line and line.ingredient_id == i.id }}>{{ i.name }} ({{ i.unit }})</option>{% endfor %}</optgroup>
        {% endfor %}
      </select></div>
    <div><label>Số lượng</label><input name="quantity_{{ row }}" inputmode="decimal" class="f-qty" value="{{ line.quantity|qty if line else '' }}"></div>
    <div><label>Đơn vị HĐ</label><input name="unit_raw_{{ row }}" class="f-unit" value="{{ line.unit_raw if line else '' }}" placeholder="kg, Stk…"></div>
    <div><label>Đơn giá</label><input name="unit_price_{{ row }}" inputmode="decimal" class="f-price" value="{{ '%.2f'|format(line.unit_price) if line else '' }}"></div>
    <div><label>Thành tiền</label><input name="line_total_{{ row }}" inputmode="decimal" class="f-total" value="{{ '%.2f'|format(line.line_total) if line else '' }}"></div>
  </div>
  <div class="line-grid2">
    <div><label>Quy đổi: 1 đơn vị HĐ = ? đơn vị kho</label><input name="pack_factor_{{ row }}" inputmode="decimal" class="f-factor" value="{{ line.pack_factor|qty if line else '1' }}"></div>
    <div><label>Hạn sử dụng</label><input type="date" name="expiry_date_{{ row }}" value="{{ line.expiry_date.isoformat() if line and line.expiry_date else '' }}"></div>
    <div><label>VAT %</label><input value="{{ line.vat_rate|qty if line else '' }}" disabled></div>
  </div>
  <div class="calc"></div>
</div>
